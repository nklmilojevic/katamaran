[project]
name = "katbench"
version = "0.1.0"
description = "File-sharing benchmark harness for Docker engines on macOS"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bench = "katbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
