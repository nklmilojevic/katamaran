[package]
name = "kat-daemon"
description = "katamaran host daemon"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "katamaran"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kat-proto.workspace = true
kat-vmm.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
russh = "0.65"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "macros", "sync"] }
toml = { version = "1.0", default-features = false, features = ["parse", "serde", "display"] }

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true
