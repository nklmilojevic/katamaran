[package]
name = "kat-vmm"
description = "katamaran VM process: boots the guest on libkrun (Hypervisor.framework)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "katamaran-vm"
path = "src/bin/katamaran-vm.rs"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
kat-proto.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
krun = { package = "libkrun", path = "../../vendor/libkrun/src/libkrun", default-features = false, features = ["blk", "net"] }
