name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: Rust & Swift (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ci-macos
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The forwarding tests deliver payloads through both the standalone
      # gvproxy binary and the default in-process libgvproxy.dylib with an
      # lo0 alias on regular and privileged ports; require both so that
      # coverage cannot silently skip. setup-go and `cargo xtask gvproxy` match
      # the macos-26 release job, which builds the same gvproxy.
      - name: Build gvproxy
        run: |
          go version
          # Swatinem/rust-cache caches target/ and prunes non-Cargo files on
          # save, which can leave an empty module dir under target/go/mod that
          # tricks `go mod download` into skipping extraction. Clear target/go
          # and target/gvproxy-src before and after building gvproxy.
          rm -rf target/go target/gvproxy-src
          cargo xtask gvproxy
          rm -rf target/go target/gvproxy-src
          test -x target/release/gvproxy
          test -f target/release/libgvproxy.dylib
      - name: Add lo0 alias for forwarding tests
        run: |
          sudo ifconfig lo0 alias 172.16.254.200
          ifconfig lo0 | grep -q 'inet 172\.16\.254\.200 '
      - name: Rust unit tests
        env:
          KATAMARAN_TEST_LO0_ALIAS: 172.16.254.200
          KATAMARAN_REQUIRE_LO0_ALIAS: '1'
          KATAMARAN_REQUIRE_GVPROXY: '1'
        run: cargo test --locked
      - name: Swift app tests
        run: |
          cargo build --locked -p kat-term
          KAT_TERM_LIB_DIR="$PWD/target/debug" swift test --package-path app

  linux:
    name: Guest init & netperf (Linux arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ci-linux
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: false
      # kat-init's state.db version-detection tests drive /usr/bin/sqlite3, as the guest does.
      - name: Install sqlite3
        run: test -x /usr/bin/sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Clippy (kat-init, kat-proto)
        run: |
          cargo clippy --locked -p kat-init -p kat-proto \
            --all-targets -- -D warnings
      - name: Rust unit tests (kat-init, kat-proto)
        run: cargo test --locked -p kat-init -p kat-proto
      - name: Go tests (scripts/netperf)
        run: go -C scripts/netperf test ./...

  docs:
    name: Docs build & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run build
        working-directory: docs
